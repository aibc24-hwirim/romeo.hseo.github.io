<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">RecSys 파이널 프로젝트 결과 요약</title>
  <desc id="desc">공식 기준선과 최종 제출의 공개 NDCG 점수를 비교한다.</desc>
  <rect width="1400" height="760" fill="#f7f7f5"/>
  <rect x="72" y="64" width="1256" height="632" rx="18" fill="#ffffff" stroke="#deded8" stroke-width="2"/>
  <text x="128" y="146" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="32" font-weight="700" fill="#15161a">파이널 프로젝트 결과 요약</text>
  <text x="128" y="194" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#6d7078">세부 실험 구성은 공개하지 않고 공식 평가 결과만 기록했다.</text>
  <text x="154" y="320" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="600" fill="#747781">공식 기준선</text>
  <text x="154" y="400" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="64" font-weight="700" fill="#272933">0.0847</text>
  <path d="M520 372 H840" stroke="#5a54ff" stroke-width="8" stroke-linecap="round"/>
  <path d="M814 346 L844 372 L814 398" fill="none" stroke="#5a54ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="568" y="336" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" font-weight="600" fill="#5a54ff">검증과 실험 반복</text>
  <text x="930" y="320" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="600" fill="#747781">최종 제출</text>
  <text x="930" y="400" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="64" font-weight="700" fill="#42124e">0.1632</text>
  <rect x="128" y="502" width="1144" height="112" rx="12" fill="#f1efff"/>
  <text x="170" y="568" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#413bb8">PUBLIC NDCG@10</text>
  <text x="1080" y="568" text-anchor="end" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#413bb8">+92.7%</text>
  <text x="1240" y="568" text-anchor="end" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" fill="#6d67b8">vs. official baseline</text>
</svg>
