<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">가상 메모리와 물리 메모리 관계를 다시 정리한 학습 노트</title>
  <desc id="desc">프로세스의 가상 주소가 페이지 테이블을 거쳐 물리 메모리 또는 디스크 스왑 영역과 연결되는 흐름이다.</desc>
  <rect width="1400" height="760" fill="#f7f7f5"/>
  <text x="92" y="100" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="36" font-weight="700" fill="#17191f">메모리 파트를 다시 정리하며 그린 흐름</text>
  <text x="92" y="146" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" fill="#6f737b">프로세스가 사용하는 주소와 실제 데이터가 놓이는 위치는 같지 않다.</text>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <rect x="90" y="246" width="250" height="230" rx="18" fill="#ffffff" stroke="#d7d8d4" stroke-width="2"/>
    <text x="215" y="308" text-anchor="middle" font-size="24" font-weight="700" fill="#22252c">프로세스</text>
    <rect x="126" y="342" width="178" height="42" rx="8" fill="#ecebff"/>
    <rect x="126" y="397" width="178" height="42" rx="8" fill="#ecebff"/>
    <text x="215" y="370" text-anchor="middle" font-size="18" fill="#514baf">가상 주소 공간</text>
    <text x="215" y="425" text-anchor="middle" font-size="18" fill="#514baf">page 단위</text>
    <path d="M340 360 H482" stroke="#6560d9" stroke-width="6" stroke-linecap="round"/>
    <path d="M458 338 L486 360 L458 382" fill="none" stroke="#6560d9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="486" y="246" width="250" height="230" rx="18" fill="#ffffff" stroke="#d7d8d4" stroke-width="2"/>
    <text x="611" y="308" text-anchor="middle" font-size="24" font-weight="700" fill="#22252c">페이지 테이블</text>
    <text x="611" y="360" text-anchor="middle" font-size="19" fill="#555a64">가상 주소를</text>
    <text x="611" y="393" text-anchor="middle" font-size="19" fill="#555a64">실제 위치와 연결</text>
    <path d="M736 328 H878" stroke="#6560d9" stroke-width="6" stroke-linecap="round"/>
    <path d="M854 306 L882 328 L854 350" fill="none" stroke="#6560d9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M736 416 C790 416 810 542 878 542" fill="none" stroke="#a0a3aa" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
    <rect x="882" y="206" width="420" height="260" rx="18" fill="#ffffff" stroke="#d7d8d4" stroke-width="2"/>
    <text x="1092" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#22252c">물리 메모리 RAM</text>
    <g fill="#ddf2e4" stroke="#75a889">
      <rect x="936" y="304" width="84" height="102" rx="8"/><rect x="1030" y="304" width="84" height="102" rx="8"/>
      <rect x="1124" y="304" width="84" height="102" rx="8"/><rect x="1218" y="304" width="30" height="102" rx="8"/>
    </g>
    <text x="1092" y="434" text-anchor="middle" font-size="18" fill="#4e6757">frame에 실제 데이터 저장</text>
    <rect x="882" y="506" width="420" height="120" rx="18" fill="#ffffff" stroke="#d7d8d4" stroke-width="2"/>
    <text x="1092" y="558" text-anchor="middle" font-size="23" font-weight="700" fill="#22252c">디스크 swap</text>
    <text x="1092" y="592" text-anchor="middle" font-size="18" fill="#737780">RAM이 부족할 때 일부 페이지 이동</text>
    <text x="90" y="680" font-size="20" fill="#565a63">이 구조를 이해한 뒤 OOM, batch size, 데이터 로딩 문제를 코드 밖의 자원 문제로도 보게 됐다.</text>
  </g>
</svg>
